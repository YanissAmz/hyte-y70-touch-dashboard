# Xorg :1 for HYTE Y70 Touch — amdgpu iGPU (Raphael), DisplayPort only.
# GNOME runs on :0 (HDMI via NVIDIA RTX 3090). :1 is fully isolated so TV
# on/off and GNOME re-composition can't leak onto the HYTE output.

Section "ServerFlags"
    Option "AutoAddGPU"   "false"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
EndSection

Section "Device"
    Identifier "AMD-Hyte"
    Driver     "amdgpu"
    BusID      "PCI:22:0:0"
EndSection

Section "Monitor"
    Identifier "HYTE-Monitor"
    Option     "Primary" "true"
EndSection

Section "Screen"
    Identifier  "HYTE-Screen"
    Device      "AMD-Hyte"
    Monitor     "HYTE-Monitor"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "HYTE-Layout"
    Screen     0 "HYTE-Screen"
EndSection
