# X :0 only — ignore the HYTE ILITEK touchscreen on the primary GNOME/NVIDIA
# server so touches are not delivered to the TV session. X :1 starts with
# `-configdir xorg-hyte.d`, so it does not load this file and keeps the touch
# device attached there.

Section "InputClass"
    Identifier "Ignore HYTE touchscreen on X0"
    MatchProduct "ILITEK.*ILITEK-TOUCH"
    Option "Ignore" "true"
EndSection
