# X :1 only — keep the HYTE stack isolated from desktop/gamepad inputs that
# belong to the main GNOME session on :0. Without this, pointer events from the
# mini keyboard and DualSense touchpad can leak into the HYTE dashboard and
# trigger unintended navigation/actions while the user is interacting with the
# main desktop.

Section "InputClass"
    Identifier "Ignore desktop mini keyboard mouse on X1"
    MatchProduct "mini keyboard Mouse"
    Option "Ignore" "true"
EndSection

Section "InputClass"
    Identifier "Ignore desktop mini keyboard controls on X1"
    MatchProduct "mini keyboard"
    Option "Ignore" "true"
EndSection

Section "InputClass"
    Identifier "Ignore DualSense touchpad on X1"
    MatchProduct "DualSense Wireless Controller Touchpad"
    Option "Ignore" "true"
EndSection
